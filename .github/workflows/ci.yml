name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - name: Check npm tarball contents
        run: |
          set -o pipefail
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          for f in index.js src/index.js bin/pi-qqbot.mjs README.md; do
            grep -q "$f" /tmp/pack.txt
          done
          ! grep -Eq 'pi-qqbot\.json|\.log|/test/|\.git' /tmp/pack.txt
