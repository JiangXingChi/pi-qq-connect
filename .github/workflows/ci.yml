name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - name: Check npm tarball contents
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          ! grep -Eq 'pi-qqbot\.json|\.log|/test/|\.git' /tmp/pack.txt
